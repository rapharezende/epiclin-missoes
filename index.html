<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operação Laudo Seguro</title><style>
*{box-sizing:border-box}body{margin:0;color:#172e36;background:#244441;font:17px/1.6 system-ui,sans-serif;min-height:100vh;background-image:repeating-linear-gradient(5deg,transparent 0 5px,#ffffff03 6px 7px),linear-gradient(135deg,#315653,#162e30)}.desk{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}.paper{position:absolute;width:240px;height:330px;background:#e9dfc8;border:14px solid #ddcfaa;box-shadow:0 15px 45px #0005;transform:rotate(-14deg);left:-100px;top:130px}.paper:after{content:'RELATÓRIO CLÍNICO';font:bold 13px monospace;display:block;padding:30px 12px;border-bottom:6px double #818777}.paper.right{left:auto;right:-110px;top:350px;transform:rotate(18deg);background:repeating-linear-gradient(#f5ead4 0 26px,#c8c2b8 27px 28px)}.pen{position:absolute;width:12px;height:250px;background:linear-gradient(90deg,#8c6541,#d9b880,#734d2f);left:10%;bottom:15%;transform:rotate(25deg);border-radius:8px}.clip{position:absolute;width:90px;height:90px;border:10px solid #aab3ad;border-radius:50%;right:9%;top:9%;opacity:.65}main{max-width:660px;margin:0 auto;padding:28px 18px 50px}header{color:#f4f0df;margin-bottom:20px}.eyebrow{font:12px monospace;letter-spacing:2px;color:#c8d9d1}h1{font:700 clamp(30px,7vw,44px)/1.12 Georgia,serif;margin:12px 0}header p{margin:8px 0;color:#dce6df;font-size:15px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tools button{background:#244744;color:#fff;border:1px solid #809e96;font-size:14px;min-height:44px;padding:8px 12px}.card{background:#fbf8ee;border-radius:12px;padding:26px;box-shadow:0 18px 60px #06171955;border-top:5px solid #c5a363;animation:arrive .4s ease-out}.badge{display:inline-block;background:#e2eae3;font:700 12px monospace;letter-spacing:1px;padding:5px 9px;border-radius:4px}h2{font:700 27px/1.25 Georgia,serif;margin:16px 0}p{margin:12px 0}button,input{font:inherit}button{cursor:pointer;border-radius:7px;border:0;padding:12px 17px;min-height:48px;background:#215d52;color:white;font-weight:650}button:hover{filter:brightness(1.12)}button.secondary{background:#e7e4d8;color:#243c3c}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #bd6700;outline-offset:3px}input{width:100%;min-height:50px;padding:10px;border:1px solid #7a8b83;border-radius:6px;background:white;color:#172e36;font-size:18px}label{display:block;margin:16px 0 5px;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{margin-top:8px;font-size:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.notice{background:#e8eee7;padding:14px;border-left:4px solid #4a7767;border-radius:4px}.error{background:#fff0d9;border-color:#a2691c}.stamp{text-align:center;border:3px double #215d52;color:#215d52;transform:rotate(-3deg);font:700 27px monospace;margin:30px 0;padding:15px;animation:stamp .45s ease-out}.envelope{width:110px;height:74px;background:#d8bd83;border:2px solid #a98547;margin:20px auto;position:relative;overflow:hidden}.envelope:before{content:'';position:absolute;left:14px;top:-42px;width:78px;height:78px;background:#ead8aa;transform:rotate(45deg);border:1px solid #a98547;animation:open .6s}.progress{display:flex;gap:8px;margin-bottom:17px}.dot{flex:1;height:7px;border-radius:5px;background:#788a81}.dot.done{background:#e2bf71}.small{font-size:14px;color:#56665f}details{margin-top:18px;border-top:1px solid #cbd1c6;padding-top:12px}summary{cursor:pointer;min-height:44px;font-weight:650}.option{display:block;width:100%;text-align:left;background:white;color:#172e36;border:1px solid #889b91;margin:12px 0;font-weight:400;line-height:1.5}.option[aria-pressed=true]{border:3px solid #215d52;background:#e5eee6}.stats{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;margin:14px 0}.stats strong{font-size:23px;display:block}dialog{border:0;border-radius:12px;width:min(600px,94vw);max-height:85vh;overflow:auto;background:#fbf8ee;padding:25px;color:#172e36}dialog::backdrop{background:#031d24b0}footer{color:#d0dfd7;font-size:13px;text-align:center;margin-top:24px}.reduced *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:420px){main{padding:18px 12px 30px}.card{padding:20px 17px}body{font-size:17px}.pen,.clip{display:none}.paper{opacity:.35}.grid{gap:10px}h2{font-size:25px}}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes stamp{from{opacity:0;transform:scale(1.3) rotate(-3deg)}to{opacity:1;transform:scale(1) rotate(-3deg)}}@keyframes open{from{transform:rotate(45deg) translate(20px,20px)}to{transform:rotate(45deg)}}
</style><div class="desk" aria-hidden="true"><div class="paper"></div><div class="paper right"></div><div class="pen"></div><div class="clip"></div></div><main><header><div class="eyebrow">MISSÃO DE EPIDEMIOLOGIA CLÍNICA</div><h1>Operação<br>Laudo Seguro</h1><p>Quatro documentos. Uma equipe. Uma interpretação segura.</p></header><nav class="tools" aria-label="Ferramentas"><button id="notebook">Caderno da equipe</button><button id="motion" aria-pressed="false">Reduzir animações</button></nav><div id="progress" class="progress" aria-label="Progresso"></div><section id="screen" class="card" aria-live="polite"></section><footer>Atividade em equipe • Dados fictícios • Progresso salvo neste navegador</footer></main><dialog id="modal"><div id="modalContent"></div><button id="close">Fechar</button></dialog><script>
const KEY='laudoSeguroAtividadeV1';const fresh=()=>({team:'',stage:0,view:'start',notes:[],attempts:0,hints:0,activeMs:0,options:[],reduced:false});let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}let tick=Date.now(),selected=null;const screen=document.querySelector('#screen');const titles=['Reconstruir os resultados','Revisar o comunicado positivo','Revisar o comunicado negativo','Organizar o atendimento'];const codes=['ARQUIVO','EVIDENCIA','PRUDENCIA','DECISAO'];const fields=[['Pessoas com a condição','Pessoas sem a condição','Verdadeiros positivos (VP)','Falsos negativos (FN)','Verdadeiros negativos (VN)','Falsos positivos (FP)'],['Total de resultados positivos','VPP (%)'],['Total de resultados negativos','VPN (%)','Condição entre os negativos (%)'],['Pessoas que precisam de avaliação','Vagas adicionais necessárias']];const answers=[[360,2040,306,54,1836,204],[510,60],[1890,97.142857,2.857143],[510,90]];const texts=[`Uma população simulada de <b>2.400 pessoas</b> passou por uma triagem. A prevalência é <b>15%</b>, a sensibilidade é <b>85%</b> e a especificidade é <b>90%</b>. Reconstruam os números de pessoas.`,`O comunicado afirma: “Com sensibilidade de 85%, quem recebe um resultado positivo tem 85% de chance de apresentar a condição.” Usem os dados do caderno para calcular a proporção adequada.`,`Outro trecho afirma: “Um resultado negativo garante ausência da condição.” Verifiquem a proporção de pessoas sem a condição entre os negativos e o risco que permanece.`,`O protocolo desta missão prevê avaliação confirmatória de <b>todos os resultados positivos</b>. Há <b>420 vagas disponíveis</b>. Quantas pessoas precisam de avaliação e quantas vagas adicionais são necessárias?`];const hints=[['Calculem primeiro 15% de 2.400; o restante não apresenta a condição.','A sensibilidade se aplica às 360 pessoas com a condição; a especificidade, às 2.040 sem a condição.','VP = 85% dos doentes. FN = doentes − VP. VN = 90% dos não doentes. FP = não doentes − VN.'],['Resultados positivos = VP + FP.','VPP = VP ÷ (VP + FP) × 100.','O denominador é 510. A sensibilidade usa outro denominador.'],['Resultados negativos = VN + FN.','VPN = VN ÷ (VN + FN) × 100.','O risco residual é FN ÷ (VN + FN) × 100.'],['Todos os positivos precisam de avaliação: VP + FP.','Compare a demanda com as 420 vagas.','Não sabemos quais indivíduos positivos são VP ou FP apenas pelo resultado de triagem.']];const options=[{id:'correct',text:'Entre os positivos, 60% apresentam a condição. Entre os negativos, 2,9% apresentam a condição. Faltam 90 vagas para avaliar todos os resultados positivos.'},{id:'sensitivity',text:'O teste identifica 60% das pessoas com a condição. Entre os negativos, 2,9% apresentam a condição. Faltam 90 vagas para avaliar todos os resultados positivos.'},{id:'specificity',text:'Entre os positivos, 60% apresentam a condição. O teste identifica corretamente 97,1% das pessoas sem a condição. Faltam 90 vagas para avaliar todos os resultados positivos.'},{id:'capacity',text:'Entre os positivos, 60% apresentam a condição. Entre os negativos, 2,9% apresentam a condição. As 420 vagas atendem à avaliação de todos os resultados positivos.'}];function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function clock(){let now=Date.now();if(state.view==='task'||state.view==='final')state.activeMs+=now-tick;tick=now;save()}setInterval(clock,1000);function move(view){clock();state.view=view;save();render()}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(){let old=state.options.join(',');do{state.options=options.map(x=>x.id);for(let i=state.options.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[state.options[i],state.options[j]]=[state.options[j],state.options[i]]}}while(state.options.join(',')===old);selected=null;save()}function modal(html){document.querySelector('#modalContent').innerHTML=html;document.querySelector('#modal').showModal()}function message(text,error=false){let el=document.querySelector('#message');if(el){el.className='notice '+(error?'error':'');el.textContent=text}}function render(){document.body.classList.toggle('reduced',state.reduced);document.querySelector('#motion').setAttribute('aria-pressed',String(state.reduced));document.querySelector('#progress').innerHTML=Array.from({length:4},(_,i)=>`<span class="dot ${i<state.notes.length?'done':''}"></span>`).join('');if(state.view==='start'){screen.innerHTML=`<span class="badge">DOSSIÊ 01 · ACESSO DA EQUIPE</span><h2>Um relatório precisa de vocês.</h2><p>Um comunicado de triagem contém interpretações que podem induzir a decisões inadequadas. Reconstruam os dados, revisem as conclusões e organizem o atendimento.</p><div class="notice">Trabalhem em equipe. Cada envelope traz o código do próximo documento. Sem reteste nesta missão.</div><label for="team">Nome da equipe</label><input id="team" required maxlength="40" placeholder="Ex.: Investigadores da Saúde" value="${esc(state.team)}"><div class="actions"><button id="start">Entrar na missão</button></div>`;document.querySelector('#start').onclick=()=>{let val=document.querySelector('#team').value.trim();if(!val){document.querySelector('#team').reportValidity();document.querySelector('#team').focus();return}state.team=val;move('gate')};return}if(state.view==='gate'){screen.innerHTML=`<span class="badge">ENVELOPE ${state.stage+1} · ${esc(state.team)}</span><div class="envelope" aria-hidden="true"></div><h2>${state.stage?'Próximo documento lacrado':'Abram o primeiro envelope'}</h2><p>${state.stage?'Retirem o próximo envelope com a docente. Não é necessário aguardar uma liberação no sistema.':'Recebam o envelope 1 e encontrem a palavra-chave.'}</p><label for="code">Código do envelope</label><input id="code" autocapitalize="characters" autocomplete="off" placeholder="Digite a palavra-chave"><p id="message" class="small">O código está no envelope entregue pela docente.</p><div class="actions"><button id="unlock">Abrir documento</button></div>`;document.querySelector('#unlock').onclick=()=>{let code=document.querySelector('#code').value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();if(code===codes[state.stage]){state.hintLevel=0;move('task')}else message('Código não reconhecido. Confiram o envelope desta etapa.',true)};return}if(state.view==='task'){screen.innerHTML=`<span class="badge">DOCUMENTO ${state.stage+1} DE 4</span><h2>${titles[state.stage]}</h2><p>${texts[state.stage]}</p><p class="small">${state.stage===0?'As quantidades representam pessoas: usem números inteiros.':'Percentuais podem ter casas decimais. Arredondem para uma casa; vírgula ou ponto são aceitos.'}</p><form id="taskForm"><div class="grid">${fields[state.stage].map((x,i)=>`<div><label for="a${i}">${x}</label><input id="a${i}" required inputmode="decimal" autocomplete="off" aria-label="${x}"></div>`).join('')}</div><div class="actions"><button type="submit">Verificar análise</button><button type="button" class="secondary" id="hint">Pedir dica</button></div></form><p id="message" class="small">Consultem os dados anteriores no caderno da equipe.</p>`;document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();state.attempts++;let valid=answers[state.stage].every((a,i)=>{let raw=document.querySelector('#a'+i).value.trim().replace(',','.');let n=Number(raw);return raw!==''&&Number.isFinite(n)&&Math.abs(n-a)<(Number.isInteger(a)?0.00001:0.055)});save();if(!valid){message('A análise precisa de revisão. Confiram os denominadores e as quantidades. Os valores digitados foram mantidos.',true);return}state.notes.push({title:titles[state.stage],values:fields[state.stage].map((label,i)=>({label,value:document.querySelector('#a'+i).value}))});if(state.stage===3){shuffle();move('final')}else move('success')};document.querySelector('#hint').onclick=()=>{state.hints++;let i=Math.min(state.hintLevel||0,2);state.hintLevel=i+1;message(hints[state.stage][i]);save()};return}if(state.view==='success'){screen.innerHTML=`<span class="badge">DOCUMENTO ${state.stage+1} CONCLUÍDO</span><div class="stamp">VALIDADO</div><h2>Uma peça do caso foi esclarecida.</h2><p>Retirem o <b>envelope ${state.stage+2}</b> com a docente. O código abrirá automaticamente o próximo documento.</p><p class="small">Os resultados já estão no caderno. O tempo de resolução fica pausado enquanto aguardam o envelope.</p><button id="next">Digitar o próximo código</button>`;document.querySelector('#next').onclick=()=>{state.stage++;move('gate')};return}if(state.view==='final'){screen.innerHTML=`<span class="badge">COMUNICADO FINAL</span><h2>Qual comunicado pode ser divulgado?</h2><p>Selecionem a versão coerente com os resultados. Todas se referem à população simulada desta missão.</p>${state.options.map(id=>`<button class="option" data-id="${id}" aria-pressed="false">${options.find(o=>o.id===id).text}</button>`).join('')}<button id="checkFinal">Validar comunicado</button><p id="message" class="small">Escolham uma versão e validem a decisão.</p>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selected=b.dataset.id;document.querySelectorAll('.option').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.querySelector('#checkFinal').onclick=()=>{if(!selected){message('Selecionem uma versão antes de validar.',true);return}state.attempts++;if(selected==='correct'){move('finished')}else{shuffle();render();message('Revisem a quem cada percentual se refere e se as vagas atendem à demanda. As opções foram embaralhadas para a nova tentativa.',true)}};return}if(state.view==='finished'){let mins=Math.floor(state.activeMs/60000),secs=Math.floor(state.activeMs/1000)%60;screen.innerHTML=`<span class="badge">MISSÃO CONCLUÍDA</span><div class="stamp">LAUDO SEGURO</div><h2>${esc(state.team)}, caso resolvido!</h2><p>Apresentem esta tela à docente para registrar a ordem de conclusão.</p><div class="stats"><div><strong>${mins}:${String(secs).padStart(2,'0')}</strong>Tempo de resolução</div><div><strong>${state.attempts}</strong>Verificações</div><div><strong>${state.hints}</strong>Dicas solicitadas</div></div><div class="notice">O VPP foi 60%; o VPN, 97,1%. Um resultado negativo deixou risco residual de 2,9%. A avaliação dos 510 positivos exige 90 vagas adicionais.</div><p class="small">Esta atividade não envia resultados e não compara equipes automaticamente. O tempo é local e exclui a espera pelos envelopes.</p><button id="restart" class="secondary">Iniciar nova missão</button>`;document.querySelector('#restart').onclick=reset}}
function reset(){if(confirm('Apagar o progresso desta equipe e iniciar uma nova missão?')){state=fresh();tick=Date.now();save();render()}}document.querySelector('#close').onclick=()=>document.querySelector('#modal').close();document.querySelector('#notebook').onclick=()=>modal(`<h2>Caderno da equipe</h2><p>${esc(state.team||'Equipe ainda não registrada')}</p>${state.notes.length?state.notes.map(n=>`<h3>${n.title}</h3>${n.values.map(x=>`<p><b>${x.label}:</b> ${esc(x.value)}</p>`).join('')}`).join(''):'<p>Os dados serão acrescentados após a validação de cada documento.</p>'}`);document.querySelector('#motion').onclick=()=>{state.reduced=!state.reduced;save();render()};render();
</script></html>
